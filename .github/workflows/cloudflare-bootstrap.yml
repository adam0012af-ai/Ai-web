name: Cloudflare Bootstrap

on:
  push:
    branches: [cloudflare/vinext-bootstrap]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-bootstrap.yml
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - prisma/**
      - vite.config.ts
      - wrangler.jsonc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      # Build-only placeholder. This workflow never connects to a database.
      DATABASE_URL: postgresql://nexa:nexa@127.0.0.1:5432/nexa?schema=public

    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate the Prisma client explicitly
        run: npm run prisma:generate

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: i18n audit
        id: i18n
        continue-on-error: true
        run: npm run check:i18n

      - name: Build vinext Cloudflare target
        id: cloudflare_build
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 600s npm run build:vinext 2>&1 | tee cloudflare-build.txt

      - name: Validate generated Worker bundle
        id: worker_dry_run
        if: steps.cloudflare_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          test -f dist/server/wrangler.json || {
            echo "Expected dist/server/wrangler.json was not generated." | tee cloudflare-dry-run.txt
            exit 1
          }
          npx --no-install wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee cloudflare-dry-run.txt

      - name: Upload Cloudflare build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudflare-bootstrap-diagnostics-${{ github.run_attempt }}
          path: |
            cloudflare-build.txt
            cloudflare-dry-run.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish bootstrap summary
        if: always()
        run: |
          {
            echo "## Nexa Cloudflare bootstrap"
            echo
            echo "No Cloudflare credentials were available to build steps."
            echo "No deployment or database operation was attempted."
            echo "TypeScript: ${{ steps.typecheck.outcome }}"
            echo "i18n: ${{ steps.i18n.outcome }}"
            echo "vinext build: ${{ steps.cloudflare_build.outcome }}"
            echo "Worker dry-run: ${{ steps.worker_dry_run.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce validation result
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          I18N: ${{ steps.i18n.outcome }}
          BUILD: ${{ steps.cloudflare_build.outcome }}
          DRY_RUN: ${{ steps.worker_dry_run.outcome }}
        run: |
          test "$TYPECHECK" = success
          test "$I18N" = success
          test "$BUILD" = success
          test "$DRY_RUN" = success

