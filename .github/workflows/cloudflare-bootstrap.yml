name: Cloudflare Bootstrap

on:
  push:
    branches: [cloudflare/vinext-bootstrap]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexa-cloudflare-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      # Build-only placeholder. No migrations, seed, security baseline, or
      # production database writes are performed by this workflow.
      DATABASE_URL: postgresql://nexa:nexa@127.0.0.1:5432/nexa?schema=public

    steps:
      - name: Checkout Cloudflare bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare/vinext-bootstrap
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare target dependencies
        run: npm install --no-audit --no-fund

      - name: Build vinext Cloudflare target
        id: cloudflare_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 600s npm run build:vinext 2>&1 | tee cloudflare-build.txt

      - name: Validate generated Worker bundle
        id: worker_dry_run
        if: steps.cloudflare_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f dist/server/wrangler.json ]; then
            echo "Expected dist/server/wrangler.json was not generated." | tee cloudflare-dry-run.txt
            exit 1
          fi
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee cloudflare-dry-run.txt

      - name: Upload Cloudflare build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-bootstrap-diagnostics
          path: |
            cloudflare-build.txt
            cloudflare-dry-run.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Commit generated package lock
        if: steps.cloudflare_build.outcome == 'success'
        shell: bash
        run: |
          rm -f cloudflare-build.txt cloudflare-dry-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "Lock Cloudflare bootstrap dependencies [skip ci]"
            git push origin HEAD:cloudflare/vinext-bootstrap
          fi

      - name: Publish bootstrap summary
        if: always()
        shell: bash
        run: |
          echo "## Nexa Cloudflare bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Main branch was not changed by this bootstrap run." >> "$GITHUB_STEP_SUMMARY"
          echo "vinext build: ${{ steps.cloudflare_build.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker dry-run: ${{ steps.worker_dry_run.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if Cloudflare validation failed
        if: steps.cloudflare_build.outcome == 'failure' || steps.worker_dry_run.outcome == 'failure'
        run: exit 1
