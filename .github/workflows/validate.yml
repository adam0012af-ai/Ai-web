name: Validate Nexa V6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Prisma 7 loads DATABASE_URL while generating the client. This is a
      # non-routable validation-only value; the workflow never connects to it.
      DATABASE_URL: postgresql://nexa:nexa@127.0.0.1:5432/nexa?schema=public
      PRISMA_HIDE_UPDATE_MESSAGE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: TypeScript check
        run: npm run typecheck

      - name: i18n audit
        run: npm run check:i18n
