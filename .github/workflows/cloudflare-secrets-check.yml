name: Cloudflare Secret Readiness

on:
  push:
    branches: [cloudflare/vinext-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      HAS_CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
      HAS_CF_AI: ${{ secrets.CLOUDFLARE_AI_API_TOKEN != '' }}
    steps:
      - name: Report names only
        shell: bash
        run: |
          echo "## Nexa Cloudflare secret readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Present |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CLOUDFLARE_API_TOKEN (deploy only) | $HAS_CF_DEPLOY_TOKEN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CLOUDFLARE_ACCOUNT_ID | $HAS_CF_ACCOUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DATABASE_URL | $HAS_DATABASE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GEMINI_API_KEY | $HAS_GEMINI |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OPENROUTER_API_KEY | $HAS_OPENROUTER |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CLOUDFLARE_AI_API_TOKEN | $HAS_CF_AI |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_CF_DEPLOY_TOKEN" = "true" ] && [ "$HAS_CF_ACCOUNT" = "true" ] && [ "$HAS_DATABASE" = "true" ]; then
            echo "Infrastructure secrets are ready for a controlled Worker deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "One or more required infrastructure secrets are missing. No deployment should be attempted." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$HAS_GEMINI" = "true" ] || [ "$HAS_OPENROUTER" = "true" ] || [ "$HAS_CF_AI" = "true" ]; then
            echo "At least one runtime AI provider is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No runtime AI provider key is configured yet; Chat AI would be unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
