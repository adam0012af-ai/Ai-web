name: Cloudflare Secret Readiness

on:
  push:
    branches: [cloudflare/vinext-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-cloudflare-secret-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
      HAS_SESSION_SECRET: ${{ secrets.SESSION_SECRET != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
      HAS_CF_AI: ${{ secrets.CLOUDFLARE_AI_API_TOKEN != '' }}
    steps:
      - name: Report names and presence only
        run: |
          {
            echo "## Nexa Cloudflare secret readiness"
            echo
            echo "| Secret | Present |"
            echo "| --- | --- |"
            echo "| CLOUDFLARE_API_TOKEN (deploy only) | $HAS_CF_DEPLOY_TOKEN |"
            echo "| CLOUDFLARE_ACCOUNT_ID | $HAS_CF_ACCOUNT |"
            echo "| DATABASE_URL | $HAS_DATABASE |"
            echo "| SESSION_SECRET | $HAS_SESSION_SECRET |"
            echo "| GEMINI_API_KEY | $HAS_GEMINI |"
            echo "| OPENROUTER_API_KEY | $HAS_OPENROUTER |"
            echo "| CLOUDFLARE_AI_API_TOKEN | $HAS_CF_AI |"
            echo
            if [ "$HAS_CF_DEPLOY_TOKEN" = true ] && [ "$HAS_CF_ACCOUNT" = true ] && [ "$HAS_DATABASE" = true ] && [ "$HAS_SESSION_SECRET" = true ]; then
              echo "Infrastructure credentials are ready for an isolated preview deployment."
            else
              echo "One or more required preview credentials are missing. No deployment should be attempted."
            fi
            if [ "$HAS_GEMINI" = true ] || [ "$HAS_OPENROUTER" = true ] || [ "$HAS_CF_AI" = true ]; then
              echo "At least one runtime AI provider is configured."
            else
              echo "No runtime AI provider credential is configured; Chat AI would be unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

