name: Promote Nexa Admin

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Nexa production URL"
        required: true
        default: "https://ai-web-c8fn.vercel.app"

permissions:
  contents: read
  id-token: write

jobs:
  promote-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Validate configured email secret
        shell: bash
        env:
          NEXA_ADMIN_EMAIL: ${{ secrets.NEXA_ADMIN_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${NEXA_ADMIN_EMAIL:-}" ]; then
            echo "Missing GitHub Actions secret: NEXA_ADMIN_EMAIL"
            echo "Add it under Repository Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

          case "$NEXA_ADMIN_EMAIL" in
            superadmin@nexa.demo|admin@nexa.demo)
              echo "Seeded demo admin addresses are not allowed."
              exit 1
              ;;
          esac

          echo "Admin email secret is configured."

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexa-admin-promotion")

          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})")

          if [ -z "$TOKEN" ]; then
            echo "GitHub OIDC token was not returned."
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "GitHub OIDC token acquired."

      - name: Promote configured Nexa account
        shell: bash
        env:
          NEXA_ADMIN_EMAIL: ${{ secrets.NEXA_ADMIN_EMAIL }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -euo pipefail

          SITE_URL="${SITE_URL%/}"
          BODY=$(node -e "process.stdout.write(JSON.stringify({email:process.env.NEXA_ADMIN_EMAIL}))")

          HTTP_CODE=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "${SITE_URL}/api/admin/bootstrap")

          cat response.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Admin promotion failed with HTTP $HTTP_CODE."
            echo "If this is 404, wait for the latest Vercel deployment to finish and run this workflow again."
            exit 1
          fi

          echo "Nexa SUPER_ADMIN promotion completed successfully."
