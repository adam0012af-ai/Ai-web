name: Apply ZIP Update (Desktop)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexa-zip-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest ZIP in repository root
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(git ls-files '*.zip' | awk 'index($0, "/") == 0')

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "No ZIP file was found in the repository root."
            echo "Upload the Nexa update ZIP from Code > Add file > Upload files, then run this workflow again."
            exit 1
          fi

          SELECTED=""
          SELECTED_TS=0

          for FILE in "${ZIPS[@]}"; do
            TS=$(git log -1 --format=%ct -- "$FILE" 2>/dev/null || echo 0)
            if [ "$TS" -ge "$SELECTED_TS" ]; then
              SELECTED="$FILE"
              SELECTED_TS="$TS"
            fi
          done

          if [ -z "$SELECTED" ] || [ ! -f "$SELECTED" ]; then
            echo "Unable to select a valid ZIP file."
            exit 1
          fi

          echo "ZIP_FILE=$SELECTED" >> "$GITHUB_ENV"
          echo "Selected update: $SELECTED"

      - name: Validate ZIP safely
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$ZIP_FILE"

          if ! unzip -tq "$ZIP" >/dev/null; then
            echo "The ZIP archive is damaged or invalid: $ZIP"
            exit 1
          fi

          while IFS= read -r ENTRY; do
            NORMALIZED="${ENTRY//\\//}"

            if [[ "$NORMALIZED" == /* ]] || [[ "$NORMALIZED" =~ ^[A-Za-z]:/ ]] || [[ "$NORMALIZED" =~ (^|/)\.\.(/|$) ]]; then
              echo "Unsafe archive path rejected: $ENTRY"
              exit 1
            fi

            case "$NORMALIZED" in
              .env|*/.env|.env.local|*/.env.local|.env.production|*/.env.production|.env.development|*/.env.development|.env.preview|*/.env.preview|.env.test|*/.env.test)
                echo "Secret environment file rejected from ZIP: $ENTRY"
                exit 1
                ;;
            esac
          done < <(zipinfo -1 "$ZIP")

          echo "ZIP validation passed."

      - name: Extract update safely
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$ZIP_FILE"

          rm -rf .unpack
          mkdir -p .unpack
          unzip -q "$ZIP" -d .unpack

          TOP_DIRS=$(find .unpack -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          TOP_FILES=$(find .unpack -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')

          # If a ZIP contains one wrapper folder and no root files, strip only that wrapper.
          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            ROOT_DIR=$(find .unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)
            SOURCE="$ROOT_DIR/"
          else
            SOURCE=".unpack/"
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --include='.env.example' \
            "$SOURCE" ./

          rm -rf .unpack
          rm -f "$ZIP"

          if [ ! -f package.json ] || [ ! -d src ]; then
            echo "Safety check failed: repository no longer looks like the Nexa Next.js project."
            exit 1
          fi

          echo "Update extracted successfully."

      - name: Show changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short

      - name: Commit and push update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # The update ZIP is never allowed to replace GitHub workflow files.
          git reset -- .github/workflows 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          UPDATE_NAME="${ZIP_FILE%.zip}"
          git commit -m "Apply Nexa update: ${UPDATE_NAME}"

          # If a harmless commit landed while this workflow was running, rebase before pushing.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Nexa update applied successfully."
