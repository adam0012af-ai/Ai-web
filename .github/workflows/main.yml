name: Unzip Project

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP file name in repository root"
        required: true
        default: "nexa-ai-mobile-ready.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ZIP file
        shell: bash
        run: |
          ZIP="${{ inputs.zip_file }}"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found: $ZIP"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

      - name: Extract project
        shell: bash
        run: |
          set -e
          ZIP="${{ inputs.zip_file }}"
          rm -rf .unpack
          mkdir -p .unpack
          unzip -q "$ZIP" -d .unpack

          # If the ZIP contains exactly one top-level folder,
          # move that folder's CONTENTS to the repository root.
          TOP_DIRS=$(find .unpack -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find .unpack -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            ROOT_DIR=$(find .unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)
            rsync -a --exclude='.git' "$ROOT_DIR"/ ./
          else
            rsync -a --exclude='.git' .unpack/ ./
          fi

          rm -rf .unpack
          rm -f "$ZIP"

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract project files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
