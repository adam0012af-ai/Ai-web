name: Unzip Project

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP file name in repository root"
        required: true
        default: "nexa-ai-mobile-ready.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ZIP file
        shell: bash
        run: |
          set -e
          ZIP="${{ inputs.zip_file }}"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found: $ZIP"
            echo "Repository root files:"
            ls -la
            exit 1
          fi

      - name: Extract project safely
        shell: bash
        run: |
          set -e
          ZIP="${{ inputs.zip_file }}"

          rm -rf .unpack
          mkdir -p .unpack
          unzip -q "$ZIP" -d .unpack

          TOP_DIRS=$(find .unpack -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find .unpack -mindepth 1 -maxdepth 1 -type f | wc -l)

          # GitHub's default Actions token cannot push/create workflow files.
          # Keep the workflow already in the repo and skip workflows from the ZIP.
          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            ROOT_DIR=$(find .unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)
            rsync -a \
              --exclude='.git' \
              --exclude='.github/workflows/' \
              "$ROOT_DIR"/ ./
          else
            rsync -a \
              --exclude='.git' \
              --exclude='.github/workflows/' \
              .unpack/ ./
          fi

          rm -rf .unpack
          rm -f "$ZIP"

      - name: Commit extracted files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Safety: never let this workflow modify files under .github/workflows.
          git reset -- .github/workflows 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract project files"

          # Small retry for transient network/server failures.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Project files pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed. Retrying..."
            sleep $((attempt * 3))
          done

          echo "Push failed after 3 attempts."
          exit 1
