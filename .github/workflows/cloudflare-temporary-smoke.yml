name: Cloudflare Temporary Smoke

on:
  push:
    branches: [cloudflare/vinext-bootstrap]
    paths:
      - .github/workflows/cloudflare-temporary-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-cloudflare-temporary-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      DATABASE_URL: postgresql://nexa:nexa@127.0.0.1:5432/nexa?schema=public

    steps:
      - name: Checkout Cloudflare branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare/vinext-bootstrap

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Cloudflare target
        run: npm run build:vinext

      - name: Configure temporary smoke Worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.name = 'nexa-ai-smoke';
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy to temporary Cloudflare account
        id: deploy
        shell: bash
        run: |
          set +e
          OUTPUT="$(npx wrangler deploy --temporary --config dist/server/wrangler.json 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "Temporary Cloudflare deployment failed. Sanitized diagnostic lines:"
            printf '%s\n' "$OUTPUT" \
              | grep -Ei 'error|failed|unsupported|not supported|exceed|limit|credential|unauthenticated|forbidden|rate' \
              | sed -E 's#https?://[^[:space:]]+#<url-redacted>#g; s#[A-Za-z0-9_-]{24,}#<redacted>#g' \
              | tail -n 40 || true
            exit "$STATUS"
          fi

          WORKER_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Temporary deployment completed but the public Worker URL could not be determined safely."
            exit 1
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Temporary Worker URL: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "This temporary deployment is only for runtime validation and is not production." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test public Next.js routes
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -e
          for route in / /login /about /pricing; do
            echo "Testing $route"
            curl --fail --silent --show-error --location --max-time 25 --retry 3 --retry-delay 3 "$WORKER_URL$route" -o /tmp/nexa-page.html
            test -s /tmp/nexa-page.html
          done
          echo "Public Next.js route smoke tests passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test CSRF API runtime
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          BODY="$(curl --fail --silent --show-error --max-time 25 --retry 3 --retry-delay 3 "$WORKER_URL/api/csrf")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.token || typeof x.token !== "string") process.exit(1)' "$BODY"
          echo "CSRF API runtime smoke test passed." >> "$GITHUB_STEP_SUMMARY"
