name: Cloudflare Readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-cloudflare-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vinext-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # npm postinstall loads Prisma config. This placeholder is validation-only
      # and is never contacted by the compatibility scan.
      DATABASE_URL: postgresql://nexa:nexa@127.0.0.1:5432/nexa?schema=public
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Remove generated Prisma output before source scan
        run: rm -rf src/generated/prisma

      - name: Run vinext compatibility scan
        id: vinext_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 300s npx --yes vinext@latest check 2>&1 | tee vinext-check.txt

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-compatibility-report
          path: vinext-check.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish compatibility summary
        if: always()
        shell: bash
        run: |
          echo "## Nexa Cloudflare / vinext compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f vinext-check.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 vinext-check.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Compatibility report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if compatibility command failed
        if: steps.vinext_check.outcome == 'failure'
        run: exit 1
